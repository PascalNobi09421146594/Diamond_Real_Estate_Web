				<br>
				<br>

				<br>
				<br>

				 <br>
				<a href="Signup.html" style="text-align: center;">CLICK HERE TO SIGN UP</a>

				<br>

				<br>
				<br>		

				<div class="icons">

						<a href="https://www.instagram.com/"><i class="fa-brands fa-instagram fa-2xl" style="color: #aa3166;"></i></a>

			</div>
